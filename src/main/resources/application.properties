spring.application.name=demo
spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USERNAME}
spring.datasource.password=${POSTGRES_PASSWORD}
#spring.jpa.hibernate.ddl-auto=<create | create-drop | update | validate | none>
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
jwt.secret=${JWT_SECRET}
springdoc.packages-to-exclude=com.newyork.sharespace.config.exceptionHandling
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
sharespace.image-repo.url=${SHARESPACE_IMAGEREPO_URL}
braintree.environment=sandbox
paypal.merchantID=${MERCHANT_ID}
paypal.publicKey=${PUBLIC_KEY}
paypal.privateKey=${PRIVATE_KEY}